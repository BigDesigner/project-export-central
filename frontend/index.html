<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>TenderPulse | İhracat Portalı & Ülke Raporu</title>
  <link rel="icon" type="image/svg+xml" href="/assets/akansu-tender-pulse.svg">
  <link rel="alternate icon" type="image/png" href="/assets/akansu-tender-pulse-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root {
      /* Base DeepSearch Theme Colors */
      --color-bg-page: #f8fafc;
      --color-bg-ocean: #f8fafc;
      --color-bg-sidebar: rgba(255, 255, 255, 0.98);
      --color-bg-panel: #ffffff;
      --color-bg-card: #ffffff;
      --color-bg-input: #ffffff;
      --color-bg-modal-overlay: rgba(15, 23, 42, 0.4);
      --color-bg-badge-subtle: rgba(15, 23, 42, 0.06);
      --color-bg-hover-subtle: rgba(15, 23, 42, 0.04);
      
      /* Country & Map Colors */
      --color-map-country-fill: #ffffff;
      --color-map-country-stroke: #cbd5e1;
      --color-map-country-hover-fill: #f1f5f9;
      --color-map-country-hover-stroke: #94a3b8;

      /* Borders */
      --color-border-subtle: #e2e8f0;
      --color-border-input: #e2e8f0;
      --color-border-hover: #94a3b8;
      --color-border-overlay: rgba(0, 0, 0, 0.1);
      --color-border-dot: rgba(0, 0, 0, 0.1);
      --color-border-badge: rgba(15, 23, 42, 0.15);

      /* Typography & Icons */
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-text-inverse: #ffffff;

      /* Primary Actions */
      --color-accent-main: #0f172a;
      --color-accent-hover: #1e293b;
      --color-accent-text: #ffffff;
      --color-accent-focus-ring: rgba(15, 23, 42, 0.1);

      /* Secondary Actions */
      --color-secondary-main: #ffffff;
      --color-secondary-hover: #f1f5f9;
      --color-secondary-border: #cbd5e1;
      --color-secondary-text: #0f172a;

      /* Scrollbars */
      --color-scrollbar-thumb: rgba(0, 0, 0, 0.15);

      /* Badges & Tables */
      --color-badge-bg: #f1f5f9;
      --color-badge-border: #cbd5e1;
      --color-badge-text: #0f172a;
      --color-row-alt: #f8fafc;
      --color-row-hover: #f1f5f9;

      /* Status Colors */
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
      --color-danger-border: rgba(239, 68, 68, 0.3);
      --color-success: #10b981;

      /* Shadows */
      --shadow-subtle: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-depth: 10px 0 30px rgba(15, 23, 42, 0.06);
      --shadow-modal: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
      --shadow-picker-selected: 0 0 8px rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background-color: var(--color-bg-page);
      color: var(--color-text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Map Container */
    #map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background-color: var(--color-bg-ocean);
    }

    #map-container:active {
      cursor: grabbing;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Country path styling */
    path {
      fill: var(--color-map-country-fill);
      stroke: var(--color-map-country-stroke);
      stroke-width: 0.15px;
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    #World, #Ocean {
      fill: var(--color-bg-ocean) !important;
      stroke: none !important;
    }

    .admin-mode path, .admin-mode circle {
      cursor: pointer;
    }

    .admin-mode g:hover path {
      fill: var(--color-map-country-hover-fill);
      stroke: var(--color-map-country-hover-stroke);
    }

    /* Floating Menu Toggle Button (Below Shell Header) */
    .menu-toggle-btn {
      position: fixed;
      top: 68px;
      left: 334px;
      z-index: 1100;
      width: 38px;
      height: 38px;
      background: var(--color-bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-border-input);
      border-radius: 10px;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      box-shadow: var(--shadow-subtle);
    }
    
    .menu-toggle-btn:hover {
      background: var(--color-secondary-hover);
      border-color: var(--color-border-hover);
      transform: scale(1.04);
    }

    #right-menu-toggle {
      display: none !important;
    }

    /* UNIFIED SIDEBAR LAYOUT */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100vh;
      background: var(--color-bg-sidebar);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--color-border-subtle);
      padding: 68px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: var(--shadow-depth);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      scrollbar-width: thin;
      scrollbar-color: var(--color-scrollbar-thumb) transparent;
    }

    .sidebar.hidden-panel {
      transform: translateX(-100%);
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--color-scrollbar-thumb);
      border-radius: 2px;
    }

    /* Embedded Overlay Panels inside Sidebar */
    .overlay-panel {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      width: 100% !important;
      background: var(--color-bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--color-border-subtle);
      border-radius: 14px;
      padding: 14px;
      box-shadow: none;
    }

    /* Search Box inside Sidebar */
    #map-search-panel {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      width: 100% !important;
      padding: 10px;
      z-index: 10;
    }

    /* Forms & Controls (Scoped to avoid global side-effects) */
    .form-group {
      margin-bottom: 10px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .sidebar select,
    .sidebar input:not(.custom-hex-text),
    #login-form select,
    #login-form input {
      width: 100%;
      padding: 9px 12px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border-input);
      border-radius: 8px;
      color: var(--color-text-main);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .sidebar select:focus,
    .sidebar input:not(.custom-hex-text):focus,
    #login-form select:focus,
    #login-form input:focus {
      border-color: var(--color-accent-main);
      box-shadow: 0 0 0 2px var(--color-accent-focus-ring);
    }

    /* Primary Buttons (Scoped) */
    .sidebar button[type="submit"],
    #login-form button[type="submit"],
    .btn-primary {
      width: 100%;
      padding: 9px 14px;
      background: var(--color-accent-main);
      border: 1px solid var(--color-accent-main);
      border-radius: 8px;
      color: var(--color-accent-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .sidebar button[type="submit"]:hover,
    #login-form button[type="submit"]:hover,
    .btn-primary:hover {
      background: var(--color-accent-hover) !important;
      border-color: var(--color-accent-hover) !important;
      color: #ffffff !important;
    }

    /* Secondary Buttons (Scoped) */
    .sidebar button.secondary,
    .confirm-modal-buttons button.secondary,
    .btn-secondary {
      width: 100%;
      padding: 9px 14px;
      background: var(--color-secondary-main);
      color: var(--color-secondary-text);
      border: 1px solid var(--color-secondary-border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .sidebar button.secondary:hover,
    .confirm-modal-buttons button.secondary:hover,
    .btn-secondary:hover {
      background: var(--color-secondary-hover) !important;
      border-color: var(--color-border-hover) !important;
      color: var(--color-text-main) !important;
    }

    /* Danger Buttons (Scoped) */
    button.danger,
    .btn-danger {
      background: var(--color-danger) !important;
      border: 1px solid var(--color-danger) !important;
      color: #ffffff !important;
      transition: all 0.2s ease;
    }
    button.danger:hover,
    .btn-danger:hover {
      background: var(--color-danger-hover) !important;
      border-color: var(--color-danger-hover) !important;
    }

    /* App Shell Header Tabs */
    .module-tab-btn {
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .module-tab-btn.active {
      background-color: #ffffff !important;
      color: #0f172a !important;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
    }
    .module-tab-btn:not(.active) {
      background-color: transparent !important;
      color: #475569 !important;
    }
    .module-tab-btn:not(.active):hover {
      background-color: rgba(255, 255, 255, 0.75) !important;
      color: #0f172a !important;
    }

    #shell-logout-btn {
      background-color: #ffffff !important;
      color: #475569 !important;
      border: 1px solid #e2e8f0 !important;
      transition: all 0.2s ease !important;
    }
    #shell-logout-btn:hover {
      background-color: #fff1f2 !important;
      border-color: #fecdd3 !important;
      color: #be123c !important;
    }

    #logout-btn:hover {
      background: #fef2f2 !important;
      border-color: var(--color-danger-border) !important;
      color: var(--color-danger) !important;
    }

    /* Specific Action Buttons */
    #sidebar-close-btn:hover,
    #close-reps-btn:hover,
    #close-assign-btn:hover {
      background: var(--color-bg-hover-subtle) !important;
      border-color: var(--color-border-hover) !important;
      color: var(--color-text-main) !important;
    }

    #map-search-clear:hover {
      background: var(--color-bg-hover-subtle) !important;
      color: var(--color-text-main) !important;
    }

    #delete-rep-btn:hover {
      background: var(--color-danger-hover) !important;
      color: #ffffff !important;
    }

    #admin-add-country-btn:hover {
      background: #059669 !important;
      color: #ffffff !important;
    }

    /* Assign Country Popup inside Sidebar */
    #assign-panel {
      display: none;
      border: 1px solid var(--color-accent-main);
      background: var(--color-bg-card);
    }
    #assign-panel.active {
      display: block;
    }

    /* Action Buttons Toolbar at Sidebar Bottom */
    .floating-actions {
      position: relative;
      bottom: auto;
      right: auto;
      display: flex;
      flex-direction: row;
      gap: 10px;
      width: 100%;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--color-border-subtle);
      z-index: 10;
    }

    .action-btn {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-secondary-main);
      color: var(--color-secondary-text);
      border: 1px solid var(--color-secondary-border);
      box-shadow: none;
    }

    .action-btn:hover {
      background: var(--color-secondary-hover);
    }

    /* Map Legend Container inside Sidebar */
    .map-legend-container {
      position: relative;
      bottom: auto;
      left: auto;
      transform: none;
      width: 100%;
      max-width: none;
      background: var(--color-bg-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--color-border-subtle);
      border-radius: 12px;
      padding: 10px;
      box-shadow: none;
      display: none;
      justify-content: flex-start;
      align-items: center;
    }

    .map-legend-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-main);
      width: 100%;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid var(--color-border-overlay);
    }

    /* Color Picker Styles */
    .custom-color-picker {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }
    .preset-colors {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .preset-dot {
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      border: 2px solid var(--color-border-dot);
      transition: transform 0.2s, border-color 0.2s;
    }
    .preset-dot:hover {
      transform: scale(1.1);
      border-color: var(--color-border-hover);
    }
    .preset-dot.selected {
      border-color: var(--color-accent-main);
      box-shadow: var(--shadow-picker-selected);
    }
    .preset-dot.selected::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--color-accent-main);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .custom-color-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-bg-input);
      border: 1px solid var(--color-border-subtle);
      border-radius: 8px;
      padding: 0 10px;
      height: 36px;
      width: 100%;
    }
    .hash-prefix {
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: 13px;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .custom-hex-text {
      flex: 1 1 auto !important;
      min-width: 0 !important;
      width: auto !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      height: 100% !important;
      color: var(--color-text-main) !important;
      font-size: 13px !important;
      font-family: 'JetBrains Mono', monospace !important;
      outline: none !important;
      box-shadow: none !important;
    }
    .custom-color-preview {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--color-border-overlay);
      background: var(--color-badge-bg);
      flex-shrink: 0;
    }

    /* Confirm Modal CSS */
    .confirm-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--color-bg-modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .confirm-modal-overlay.active {
      opacity: 1;
    }
    .confirm-modal-box {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border-subtle);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      box-shadow: var(--shadow-modal);
      transform: scale(0.9);
      transition: transform 0.2s ease;
      text-align: center;
    }
    .confirm-modal-overlay.active .confirm-modal-box {
      transform: scale(1);
    }
    .confirm-modal-box h4 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--color-text-main);
    }
    .confirm-modal-box p {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .confirm-modal-buttons {
      display: flex;
      gap: 12px;
    }
    .confirm-modal-buttons button {
      flex: 1;
    }
    button.danger {
      background: var(--color-danger);
      border: none;
      color: var(--color-accent-text);
    }
    button.danger:hover {
      background: var(--color-danger-hover);
    }

    #map-search-suggestions-list li {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--color-text-main);
    }
    #map-search-suggestions-list li:hover {
      background: var(--color-bg-hover-subtle);
    }
    .suggestion-badge {
      font-size: 11px;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .suggestion-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid var(--color-border-dot);
    }

    /* Login Screen - Light Corporate Theme */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--color-bg-ocean);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      transition: opacity 0.3s ease;
    }

    .login-card {
      background: var(--color-bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border-subtle);
      padding: 32px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-modal);
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--color-text-main);
    }

    .login-header p {
      font-size: 14px;
      color: var(--color-text-muted);
    }

    /* RESPONSIVE MOBILE & TABLET FULL-SCREEN SIDEBAR */
    @media (max-width: 640px) {
      .sidebar {
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        border-right: none;
        padding: 60px 16px 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen">
      <div class="login-card">
        <div class="login-header">
          <div class="w-16 h-16 rounded-2xl bg-white border border-slate-200/80 flex items-center justify-center mx-auto mb-3 shadow-sm p-1.5">
            <img src="/assets/akansu-tender-pulse.svg" alt="TenderPulse" class="w-full h-full object-contain">
          </div>
          <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">TenderPulse</h1>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" required placeholder="kullanici.adi">
          </div>
          <div class="form-group" style="margin-bottom: 20px;">
            <label for="password">Şifre</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <div id="turnstile-container" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>
          <button type="submit">Giriş Yap</button>
        </form>
      </div>
      <div style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 11px; letter-spacing: 0.05em; color: var(--color-text-muted); font-weight: 500;">
        Design & Development: <span style="color: var(--color-text-main); font-weight: 700;">GNNlabs</span>
      </div>
    </div>

    <!-- UNIFIED APP SHELL HEADER -->
    <header id="app-shell-header" class="w-full h-14 bg-white/95 backdrop-blur-md border-b border-slate-200 fixed top-0 left-0 z-[1200] flex items-center justify-between px-3 sm:px-6 shadow-xs select-none">
      <!-- Left: TenderPulse Brand -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-white border border-slate-200/80 flex items-center justify-center p-0.5 shadow-xs">
          <img src="/assets/akansu-tender-pulse.svg" alt="TenderPulse" class="w-full h-full object-contain">
        </div>
